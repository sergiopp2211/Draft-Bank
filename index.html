<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DraftBank League | Pro Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ffcc; --bg: #050811; --card: #111628; --yellow: #ffcc00; --red: #ff4d4d; --white: #ffffff; }
        body { background-color: var(--bg); color: var(--white); font-family: 'Roboto', sans-serif; }
        h1, h2, h3, h4, .nav-link { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        
        .navbar { background: #000; border-bottom: 2px solid var(--neon); }
        .league-logo { height: 50px; width: auto; filter: drop-shadow(0 0 5px var(--neon)); }

        .nav-tabs { border: none; flex-wrap: nowrap; overflow-x: auto; margin-bottom: 20px; }
        .nav-tabs .nav-link { color: #aaa; background: #1a2035; margin-right: 5px; border-radius: 8px; border: none; white-space: nowrap; }
        .nav-tabs .nav-link.active { background: var(--neon); color: #000; font-weight: bold; }

        .main-card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #252d47; margin-bottom: 25px; }
        .match-card { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--neon); }
        .table { color: var(--white) !important; font-size: 0.9rem; vertical-align: middle; }
        .table thead th { color: var(--neon); border-bottom: 1px solid #252d47; }
        .clickable-team:hover { background: rgba(0, 255, 204, 0.1); cursor: pointer; transition: 0.3s; }
        .pts-bold { color: var(--neon); font-weight: bold; font-size: 1.1rem; }
        
        .shield-mini { width: 30px; height: 30px; margin-right: 10px; object-fit: contain; }
        .shield-modal { width: 100px; height: 100px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(0,255,204,0.3)); }

        .stat-card { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--neon); display: flex; justify-content: space-between; align-items: center;}
        .badge-yellow { background: var(--yellow); color: #000; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .badge-red { background: var(--red); color: #fff; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

        .modal-content { background: #1a2035; border: 2px solid var(--neon); color: var(--white); border-radius: 20px; }
        .player-tag { background: rgba(0, 255, 204, 0.2); border: 1px solid var(--neon); color: var(--white); padding: 4px 10px; border-radius: 6px; margin: 4px; display: inline-block; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark p-3 sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <img src="https://cdn-icons-png.flaticon.com/512/5323/5323451.png" alt="Logo Liga" class="league-logo me-3">
            <h2 class="m-0 text-neon" style="color: #00ffcc;">DRAFTBANK</h2>
        </div>
        <small class="text-secondary d-none d-md-block text-uppercase">Panel de Control Oficial</small>
    </div>
</nav>

<div class="container mt-4">
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-l1">1ª DIVISIÓN</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-l2">2ª DIVISIÓN</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-copa">COPA</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-stats">ESTADÍSTICAS</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cal">CALENDARIO & NOTICIAS</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-l1">
            <div class="main-card">
                <h4 class="mb-4">CLASIFICACIÓN 1ª DIVISIÓN</h4>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>#</th><th>EQUIPO</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DIF</th><th>PTS</th></tr></thead>
                        <tbody id="body-l1"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-l2">
            <div class="main-card">
                <h4 class="mb-4">CLASIFICACIÓN F2</h4>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>#</th><th>EQUIPO</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DIF</th><th>PTS</th></tr></thead>
                        <tbody id="body-l2"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-copa">
            <div class="main-card">
                <h4 class="text-center text-neon mb-4">FASE DE GRUPOS - COPA</h4>
                <div class="row">
                    <div class="col-md-3"><h6>GRUPO A</h6><div id="grupo-a"></div></div>
                    <div class="col-md-3"><h6>GRUPO B</h6><div id="grupo-b"></div></div>
                    <div class="col-md-3"><h6>GRUPO C</h6><div id="grupo-c"></div></div>
