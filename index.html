<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DraftBank League | Pro Official</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ffcc; --bg: #050811; --card: #111628; --text-muted: #888; }
        body { background-color: var(--bg); color: white; font-family: 'Roboto', sans-serif; }
        h2, h3, .nav-link { font-family: 'Orbitron', sans-serif; text-transform: uppercase; }
        
        .navbar { background: #000; border-bottom: 2px solid var(--neon); padding: 1rem; }
        .nav-tabs { border: none; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .nav-tabs .nav-link { color: white; border: none; background: transparent; font-size: 0.9rem; padding: 10px 20px; transition: 0.3s; }
        .nav-tabs .nav-link.active { border-bottom: 3px solid var(--neon); color: var(--neon); }

        .main-card { background: var(--card); border-radius: 15px; padding: 30px; border: 1px solid #252d47; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .table { color: white; vertical-align: middle; }
        .table thead th { border: none; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
        .table tbody tr { border-bottom: 1px solid #252d47; transition: 0.2s; cursor: pointer; }
        .table tbody tr:hover { background: rgba(0, 255, 204, 0.05); }
        
        .rank-num { font-weight: bold; width: 40px; }
        .team-name { font-weight: 600; color: #fff; }
        .pts-bold { font-weight: 800; color: #fff; font-size: 1.1rem; }
        
        /* Modal Styles */
        .modal-content { background: var(--card); border: 1px solid var(--neon); border-radius: 20px; color: white; }
        .player-badge { background: rgba(0, 255, 204, 0.1); border: 1px solid var(--neon); padding: 5px 12px; border-radius: 20px; margin: 5px; display: inline-block; font-size: 0.85rem; }
        .match-box { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--neon); }
        .owner-info { color: var(--neon); font-size: 0.9rem; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <h2 class="m-0 text-neon" style="font-size: 1.2rem; letter-spacing: 2px;">DB</h2>
        <ul class="nav nav-tabs m-0" id="leagueTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-1a">1ª DIV</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-f2">F2</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-rankings">RANKINGS</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cal">CALENDARIO</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-normas">NORMAS</button></li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-1a">
            <div class="main-card">
                <h3 class="mb-4 text-neon" style="font-size: 1.4rem;">CLASIFICACIÓN 1ª DIVISIÓN</h3>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>#</th><th>Equipo</th><th>J</th><th>G</th><th>E</th><th>P</th><th>Dif</th><th>Pts</th></tr>
                        </thead>
                        <tbody id="render-1a"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-f2">
            <div class="main-card">
                <h3 class="mb-4 text-neon" style="font-size: 1.4rem;">CLASIFICACIÓN F2</h3>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>#</th><th>Equipo</th><th>J</th><th>G</th><th>E</th><th>P</th><th>Dif</th><th>Pts</th></tr>
                        </thead>
                        <tbody id="render-f2"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0">
                <h4 class="modal-title text-neon" id="m-team-name"></h4>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <span id="m-owner" class="owner-info"></span>
                <h6 class="text-muted small text-uppercase mb-3">Plantilla de Jugadores</h6>
                <div id="m-players" class="mb-4"></div>
                <hr style="border-color: #252d47;">
                <h6 class="text-muted small text-uppercase mb-3">Últimos Partidos</h6>
                <div id="m-matches"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // DATOS DE LA 1ª DIVISIÓN
    const liga1 = [
        { n: "Obolskin Club", o: "Sergio", j: 20, g: 14, e: 2, p: 4, d: 51, pts: 44, plys: ["Mbappé", "Courtois", "Rodri"] },
        { n: "Er Málaga CF", o: "Juan", j: 19, g: 14, e: 0, p: 5, d: 39, pts: 42, plys: ["Haaland", "Vini Jr", "Kimmich"] },
        { n: "Cara al Sol", o: "Dani", j: 19, g: 13, e: 2, p: 4, d: 35, pts: 38, plys: ["Kane", "Salah", "Ederson"] },
        { n: "Pedri Entrenador", o: "Adri", j: 19, g: 10, e: 3, p: 6, d: 22, pts: 33, plys: ["Pedri", "Lewandowski"] },
        { n: "Real de Madrid", o: "Carlos", j: 19, g: 9, e: 4, p: 6, d: -8, pts: 31, plys: ["Bellingham", "Gavi"] },
        { n: "Aston Birra", o: "Mikel", j: 17, g: 8, e: 3, p: 6, d: 11, pts: 27, plys: ["Watkins", "Dibu"] },
        { n: "ViaRecta FC", o: "Fran", j: 19, g: 7, e: 4, p: 8, d: 18, pts: 25, plys: ["Gerard Moreno"] },
        { n: "Teticos Madrid", o: "Luis", j: 19, g: 6, e: 3, p: 10, d: -22, pts: 21, plys: ["Griezmann"] },
        { n: "Unión Española", o: "Pablo", j: 20, g: 5, e: 3, p: 12, d: -26, pts: 18, plys: ["Aspas"] },
        { n: "Casinos FC", o: "Manu", j: 20, g: 4, e: 3, p: 13, d: -43, pts: 15, plys: ["Joselu"] },
        { n: "Salamanca", o: "Pepe", j: 17, g: 0, e: 1, p: 16, d: -77, pts: 1, plys: ["Canales"] }
    ];

    // DATOS DE LA F2
    const liga2 = [
        { n: "AB Tara", o: "Santi", j: 19, g: 16, e: 1, p: 2, d: 47, pts: 49, plys: ["Benzema"] },
        { n: "Peeina FC", o: "Hugo", j: 18, g: 13, e: 2, p: 3, d: 19, pts: 40, plys: ["Lautaro"] },
        { n: "Loluba", o: "Ruben", j: 18, g: 11, e: 1, p: 6, d: -2, pts: 34, plys: ["Foden"] },
        { n: "Bordaletas", o: "Jose", j: 20, g: 11, e: 0, p: 9, d: 18, pts: 33, plys: ["Getafe Man"] },
        { n: "Nazis FC", o: "Unknown", j: 19, g: 9, e: 1, p: 9, d: -1, pts: 28, plys: ["Hummels"] }
        // ... añadir resto según imagen 2
    ];

    const matches = [
        { l: "Obolskin Club", v: "Er Málaga CF", r: "3 - 1", j: "Jor 18" },
        { l: "Cara al Sol", v: "Pedri Entrenador", r: "2 - 2", j: "Jor 19" }
    ];

    function renderTable(data, elementId) {
        const tbody = document.getElementById(elementId);
        data.forEach((eq, i) => {
            const tr = document.createElement('tr');
            tr.onclick = () => showDetails(eq);
            tr.innerHTML = `
                <td class="rank-num text-muted">${i+1}</td>
                <td class="team-name">${eq.n}</td>
                <td>${eq.j}</td><td>${eq.g}</td><td>${eq.e}</td><td>${eq.p}</td>
                <td class="${eq.d > 0 ? 'text-success' : 'text-danger'}">${eq.d > 0 ? '+' : ''}${eq.d}</td>
                <td class="pts-bold">${eq.pts}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showDetails(team) {
        document.getElementById('m-team-name').innerText = team.n;
        document.getElementById('m-owner').innerText = "Manager: " + team.o;
        
        const pDiv = document.getElementById('m-players');
        pDiv.innerHTML = team.plys.map(p => `<span class="player-badge">${p}</span>`).join('');
        
        const mDiv = document.getElementById('m-matches');
        const teamMatches = matches.filter(m => m.l === team.n || m.v === team.n);
        mDiv.innerHTML = teamMatches.length ? teamMatches.map(m => `
            <div class="match-box d-flex justify-content-between align-items-center">
                <small class="text-muted">${m.j}</small>
                <span>${m.l} <b>${m.r}</b> ${m.v}</span>
            </div>
        `).join('') : '<p class="small text-muted">No hay partidos registrados aún.</p>';

        new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderTable(liga1, 'render-1a');
        renderTable(liga2, 'render-f2');
    });
</script>
</body>
</html>
