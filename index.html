<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga DraftBank | Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ffcc; --bg: #050811; --card: #111628; }
        body { background-color: var(--bg); color: white; font-family: 'Roboto', sans-serif; }
        h2, h3, .nav-link { font-family: 'Orbitron', sans-serif; }
        .navbar { background: #000; border-bottom: 2px solid var(--neon); }
        .nav-tabs .nav-link { color: white; border: none; background: #1a2035; margin-right: 5px; }
        .nav-tabs .nav-link.active { background: var(--neon); color: #000; }
        .card-stats { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #252d47; }
        .clickable-team { color: var(--neon); cursor: pointer; text-decoration: none; }
        .clickable-team:hover { text-decoration: underline; }
        .table { color: white; }
        .badge-goal { background: var(--neon); color: #000; font-weight: bold; padding: 5px 10px; border-radius: 5px; }
        .modal-content { background: var(--card); color: white; border: 1px solid var(--neon); }
        .match-row { border-bottom: 1px solid #252d47; padding: 10px 0; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark p-3">
    <div class="container text-center"><span class="navbar-brand h1">DRAFTBANK OFFICIAL WEB</span></div>
</nav>

<div class="container mt-4">
    <ul class="nav nav-tabs mb-4" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-clasificacion">TABLAS</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-rankings">RANKINGS</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-calendario">CALENDARIO</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-clasificacion">
            <div class="card-stats">
                <h3>1ª DIVISIÓN</h3>
                <table class="table table-hover">
                    <thead><tr><th>#</th><th>Equipo (Click ver partidos)</th><th>Pts</th></tr></thead>
                    <tbody id="body-1a"></tbody>
                </table>
            </div>
            <div class="card-stats">
                <h3>F2 (MINI)</h3>
                <table class="table table-hover">
                    <thead><tr><th>#</th><th>Equipo</th><th>Pts</th></tr></thead>
                    <tbody id="body-2a"></tbody>
                </table>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-rankings">
            <div class="row">
                <div class="col-md-6"><div class="card-stats"><h3>GOLEADORES</h3><div id="pichichi-list"></div></div></div>
                <div class="col-md-6"><div class="card-stats"><h3>SANCIONES</h3><div id="sanciones-list"></div></div></div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-calendario">
            <div class="card-stats" id="calendario-completo">
                <h3>PRÓXIMOS PARTIDOS</h3>
                </div>
        </div>
    </div>
</div>

<div class="modal fade" id="equipoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="modalTitulo">Partidos</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" id="modalCuerpo"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const liga1 = [
        { n: "Obolskin...", pts: 44, j: 20 }, { n: "Er Mála...", pts: 42, j: 19 },
        { n: "Cara al...", pts: 38, j: 19 }, { n: "Pedri En...", pts: 33, j: 19 }
    ];

    const jugadores = [
        { n: "Mbappé", e: "Obolskin...", g: 24, a: 2, r: 0 },
        { n: "Haaland", e: "Er Mála...", g: 19, a: 1, r: 0 }
    ];

    const partidos = [
        { local: "Obolskin...", vis: "Er Mála...", res: "3 - 1", fecha: "Jornada 20" },
        { local: "Cara al...", vis: "Pedri En...", res: "2 - 2", fecha: "Jornada 20" },
        { local: "Obolskin...", vis: "Cara al...", res: "Pendiente", fecha: "Jornada 21" }
    ];

    function cargar() {
        // Tablas
        const b1 = document.getElementById('body-1a');
        liga1.sort((a,b)=>b.pts-a.pts).forEach((eq, i) => {
            b1.innerHTML += `<tr><td>${i+1}</td><td><span class="clickable-team" onclick="verEquipo('${eq.n}')">${eq.n}</span></td><td>${eq.pts}</td></tr>`;
        });

        // Rankings
        const pList = document.getElementById('pichichi-list');
        jugadores.forEach(j => {
            pList.innerHTML += `<div class="d-flex justify-content-between mb-2"><span>${j.n} (${j.e})</span><span class="badge-goal">${j.g} G</span></div>`;
        });

        // Calendario General
        const cal = document.getElementById('calendario-completo');
        partidos.forEach(p => {
            cal.innerHTML += `<div class="match-row text-center"><strong>${p.fecha}</strong><br>${p.local} ${p.res} ${p.vis}</div>`;
        });
    }

    function verEquipo(nombre) {
        document.getElementById('modalTitulo').innerText = "Partidos de " + nombre;
        const cuerpo = document.getElementById('modalCuerpo');
        cuerpo.innerHTML = '';
        
        const filtrados = partidos.filter(p => p.local === nombre || p.vis === nombre);
        
        if(filtrados.length === 0) {
            cuerpo.innerHTML = '<p>No hay partidos registrados para este equipo.</p>';
        } else {
            filtrados.forEach(p => {
                cuerpo.innerHTML += `<div class="match-row text-center"><strong>${p.fecha}</strong><br>${p.local} ${p.res} ${p.vis}</div>`;
            });
        }
        
        new bootstrap.Modal(document.getElementById('equipoModal')).show();
    }

    window.onload = cargar;
</script>
</body>
</html>
